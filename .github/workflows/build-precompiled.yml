name: Build precompiled JavaScript file

on:
    push:
        branches:
            - enhanced
        paths:
            - '*.js'
            - 'src/**.js'
            - '.github/workflows/*.yml'
            - 'package.json'
            - 'yarn.lock'
    workflow_dispatch:

jobs:
    build-precompiled:
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            pull-requests: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cleanup precompiled
              run: rm -rf precompiled/*

            - name: Use Node.js 20
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: yarn
              env:
                  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

            - name: Install dependencies
              run: yarn

            - name: Build the precompiled package
              run: yarn build
            - name: List build output
              run: |
                 echo "Contents of dist directory:"
                 ls -la dist/ || echo "dist directory does not exist"
                 echo "Contents of precompiled directory:"
                 ls -la precompiled/ || echo "precompiled directory does not exist"
                 
            - name: Upload app.js
              uses: actions/upload-artifact@v4
              with:
                name: precompiled-app
                path: dist/app.js
